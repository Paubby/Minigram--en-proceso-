<div class="login-card">
  <h1 class="login-title">Minigram</h1>
  <p class="login-subtitle">Inicia sesión para continuar</p>

  <mat-form-field appearance="outline">
    <mat-label>Usuario o email</mat-label>
    <input matInput placeholder="pat@example.com" (input)="updateUsername($event)" />
    @for (error of email().errors(); track error) {
    <mat-error>{{ error.message }}</mat-error>
    }
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Contraseña</mat-label>
    <input matInput [type]="hide() ? 'password' : 'text'" (input)="updatePassword($event)" />
    <button matIconButton matSuffix type="button" (click)="clickEvent($event)"
      [attr.aria-label]="hide() ? 'Mostrar contraseña' : 'Ocultar contraseña'" [attr.aria-pressed]="hide()">
      <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
  </mat-form-field>

  <button mat-flat-button color="primary" class="login-button" type="button" (click)="login()">
    Entrar
  </button>
</div>
